# Ruff configuration for Databricks notebooks/scripts
# Databricks injects these names at runtime (spark, dbutils, display, etc.)
# so we tell ruff they're valid globals instead of "undefined name" errors.

# NOTE: `builtins` must be top-level, not inside [lint]
builtins = ["spark", "dbutils", "display", "sqlContext", "sc", "table", "dbfs"]

[lint]
# Relaxing these two rules for now so CI passes on existing code:
# RUF059 - unpacked variable never used (style suggestion, not a bug)
# I001   - import block un-sorted/un-formatted (cosmetic)
ignore = ["RUF059", "I001", "F401"]
